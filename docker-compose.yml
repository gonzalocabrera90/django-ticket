version: '3.8'

services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=eventlive_db
      - POSTGRES_USER=eventlive_user
      - POSTGRES_PASSWORD=eventlive_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventlive_user -d eventlive_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=eventlive_db
      - DB_USER=eventlive_user
      - DB_PASSWORD=eventlive_password
      - DB_HOST=db
      - DB_PORT=5432
      - CODESPACE_NAME=${CODESPACE_NAME}
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: